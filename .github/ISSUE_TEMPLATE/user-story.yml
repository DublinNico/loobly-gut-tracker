name: User story
description: A feature from the user's point of view
title: "[FR-XX] "
labels: ["type: story"]
body:
  - type: input
    id: req
    attributes:
      label: Requirement ID
      description: From the SRS (e.g. FR-04)
      placeholder: FR-04
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      value: |
        As a …
        I want …
        so that …
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: One scenario per criterion
      value: |
        **Scenario 1:**
        Given …
        When …
        Then …
    validations:
      required: true
  - type: dropdown
    id: moscow
    attributes:
      label: Priority (MoSCoW)
      options: [Must, Should, Could, "Won't (this release)"]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [XS, S, M, L, XL]
  - type: textarea
    id: notes
    attributes:
      label: Notes, design links, test ideas
      description: Wireframe artboard, edge cases, risks
