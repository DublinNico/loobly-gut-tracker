name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Critical: data loss, crash, missed medicine reminder, wrong safety message"
        - "Major: feature broken, no workaround"
        - "Minor: feature broken, workaround exists"
        - "Trivial: cosmetic"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: App version, phone model, Android version
      placeholder: v0.1.0, Pixel 7, Android 15
  - type: input
    id: req
    attributes:
      label: Related requirement / test case
      placeholder: FR-04 / TC-04-02
  - type: markdown
    attributes:
      value: "⚠️ Don't paste real health data. Use made-up examples."
